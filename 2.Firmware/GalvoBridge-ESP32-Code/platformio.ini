; PlatformIO Project Configuration File

[platformio]
default_envs = esp32-s3-fh4r2
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

;   底座 board：Espressif ESP32-S3-DevKitC-1（官方板）
;   覆盖项：芯片为 ESP32-S3-FH4R2（4MB Flash + 2MB PSRAM + USB CDC）

[env:esp32-s3-fh4r2]
platform = espressif32 @ 8.0.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 921600
monitor_echo = yes

; ============ 芯片特性覆盖 ============

board_build.partitions = min_spiffs.csv     ; 使用 min_spiffs.csv 分区表
board_upload.maximum_size = 4194304         ; 4 * 1024 * 1024
board_upload.flash_size = 4MB				; Flash 容量

; ============ build_flags ============

build_unflags = -DARDUINO_USB_MODE=1
build_flags =
    -DARDUINO_USB_MODE=0                     ; USB OTG CDC
    -DARDUINO_USB_CDC_ON_BOOT=1             ; 启用 USB CDC 串口
    -DBOARD_HAS_PSRAM                       ; FH4R2 内置 2MB Octal PSRAM
